[package]
name = "app"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.4", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-os = "2"
# 3.x adds `set_mode`/`Mode` (wallpaper fit) and makes its HTTP client optional,
# which keeps the ancient reqwest 0.9 that 2.x pulled in out of the tree.
wallpaper = "3.2"
anyhow = "1.0"
image = "0.24"
base64 = "0.21"
tauri-plugin-fs = "2"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "time"] }
tauri-plugin-store = "2"
# `stream` exposes reqwest's `bytes_stream()` so downloads can report progress.
tauri-plugin-http = { version = "2", features = ["stream"] }
# Self-hosted auto-updates over GitHub Releases.
tauri-plugin-updater = "2"
futures-util = "0.3"
